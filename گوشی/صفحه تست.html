<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>آزمون</title>


<link rel="stylesheet" href="./3.css">


<script src="https://unpkg.com/lucide@latest"></script>


</head>

<body>



<div class="app">


<header 
class="mobile-header page-animate"
id="appHeader">



    <!-- RIGHT PROFILE -->

<div class="mobile-header-right">


    <div class="mobile-profile-menu">


        <!-- <button 
        class="mobile-profile-btn"
        id="profileBtn"
        aria-label="profile">


            <i data-lucide="user"></i>


        </button> -->



        <!-- PROFILE DROPDOWN -->

        


    </div>


</div>



    <!-- CENTER LOGO -->


    <div class="mobile-logo">


        <i data-lucide="graduation-cap"></i>


        <span>
            برنامه کنکور
        </span>


    </div>





    <!-- LEFT ACTIONS -->


    <div class="mobile-header-left">



        <!-- THEME BUTTON -->


        <button
        class="mobile-icon-btn"
        id="themeToggle"
        aria-label="theme">


            <i data-lucide="moon"></i>


        </button>





        <!-- MENU BUTTON -->


        <button
        class="mobile-icon-btn"
        id="menuToggle"
        aria-label="menu">


            <i data-lucide="chevron-down"></i>


        </button>



    </div>



</header>
























































<div class="exam-user-card">


    <!-- بالا -->

    <div class="exam-user-header">


        <div class="user-icon-box">

            <i data-lucide="user-round"></i>

        </div>


        <div class="user-details">

            <h3>
                امیرحسین حسینی
            </h3>


            <span>
                شماره داوطلبی: 102548
            </span>

        </div>


    </div>




    <!-- اطلاعات آزمون -->


    <div class="exam-info-grid">


        <div>

            <i data-lucide="book-open"></i>

            <span>
                زیست شناسی
            </span>

        </div>



        <div>

            <i data-lucide="file-question"></i>

            <span>
                40 سوال
            </span>

        </div>



        <div>

            <i data-lucide="clock"></i>

            <span>
                45 دقیقه
            </span>

        </div>



        <div>

            <i data-lucide="calendar-days"></i>

            <span>
                آزمون آزمایشی
            </span>

        </div>



    </div>




    <!-- تذکر -->

    <div class="exam-warning">


        <i data-lucide="triangle-alert"></i>


        <p>
            با تمرکز و دقت پاسخ دهید. 
            بعد از ثبت پاسخ امکان تغییر وجود ندارد.
        </p>


    </div>



</div>























































<!-- =====================================
     TEST TIMER CARD
===================================== -->
<div class="timer-card" style="margin-top: 12px;">


    <div class="timer-header">

        <i data-lucide="clock"></i>

        <span>
            زمان باقی‌مانده
        </span>

    </div>



    <div class="timer-display" id="timer">
        60:00
    </div>


</div>












































<!-- QUESTIONS BOX -->

<section class="mobile-question-box">


    <div class="question-header">

        <span>
            سوال 1
        </span>

    </div>


    <div class="question-text">

        متن سوال اینجا نمایش داده می‌شود

    </div>



    <div class="question-options">


        <button>
            گزینه اول
        </button>


        <button>
            گزینه دوم
        </button>


        <button>
            گزینه سوم
        </button>


        <button>
            گزینه چهارم
        </button>


    </div>


</section>




<!-- STATUS TAB -->

<button class="test-status-tab">

    <i data-lucide="list-checks"></i>

</button>



<!-- STATUS PANEL -->

<div class="test-status-panel">


    <!-- HEADER -->

    <div class="status-panel-header">


        <div class="status-title">

            <i data-lucide="list-checks"></i>

            <span>
                وضعیت تست‌ها
            </span>

        </div>



        <button class="status-close-btn">

            <i data-lucide="x"></i>

        </button>


    </div>




    <!-- TEST NUMBERS -->

    <div class="test-status-grid">


        <button>1</button>

        <button>2</button>

        <button class="answered">
            3
        </button>

        <button>4</button>


        <button class="wrong">
            5
        </button>

        <button>6</button>

        <button>7</button>

        <button class="marked">
            8
        </button>


    </div>



</div>




































</div>














<script>
    document.addEventListener("DOMContentLoaded",()=>{


    const statusBtn = 
    document.querySelector(".test-status-tab");


    const statusPanel = 
    document.querySelector(".test-status-panel");



    if(!statusBtn || !statusPanel){

        console.log("STATUS ELEMENT NOT FOUND");

        return;

    }



    statusBtn.addEventListener("click",()=>{


        statusPanel.classList.toggle("active");


        console.log(
            "STATUS CLICK",
            statusPanel.classList.contains("active")
        );


    });



});


document.querySelector(".status-close-btn")
.onclick = ()=>{

    document
    .querySelector(".test-status-panel")
    .classList.remove("active");

};
</script>


<script>

lucide.createIcons();

</script>


</body>

</html>
