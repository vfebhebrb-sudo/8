<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Konkor</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0b">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">


<style>


*{

    box-sizing:border-box;

    font-family:"Vazirmatn",sans-serif;

}



:root{


    --background:#111315;

    --surface:#191c21;

    --surface-hover:#22262d;

    --text:#f9fafb;

    --text-secondary:#9ca3af;

    --border:#292e36;


    --accent:#3b82f6;

    --accent-soft:#172554;


    --shadow:
    0 8px 25px rgba(0,0,0,.35);


}





body{


    margin:0;

    min-height:100vh;


    background:var(--background);


    color:var(--text);


}




.app{


    width:100%;

    max-width:450px;


    min-height:100vh;


    margin:auto;


    padding:20px;


    display:flex;

    align-items:center;

    justify-content:center;


}




.lobby{


    width:100%;

    text-align:center;


    animation:show .8s ease;


}






.logo-box{


    width:130px;

    height:130px;


    margin:auto;


    border-radius:40px;


    background:
    linear-gradient(
    145deg,
    var(--surface),
    var(--surface-hover)
    );


    display:flex;


    align-items:center;

    justify-content:center;


    box-shadow:var(--shadow);


    border:1px solid var(--border);



}






.logo{


    width:85px;

    height:85px;


    border-radius:30px;


    background:var(--accent);


    display:flex;


    justify-content:center;

    align-items:center;


    font-size:45px;


    font-weight:800;


    color:white;



    animation:float 3s infinite ease-in-out;


}






.title{


    margin-top:30px;


    font-size:34px;


    font-weight:800;


}



.subtitle{


    margin-top:10px;


    color:var(--text-secondary);


    line-height:2;


    font-size:15px;


}






.card{


    margin-top:45px;


    padding:25px;


    border-radius:30px;


    background:
    rgba(255,255,255,.04);


    border:1px solid var(--border);


    backdrop-filter:blur(20px);



}






button{


    width:100%;


    height:55px;


    border:none;


    border-radius:18px;


    font-size:16px;


    font-weight:700;


    cursor:pointer;


    transition:.3s;


}




.login{


    background:var(--accent);


    color:white;


}




.register{


    margin-top:15px;


    background:transparent;


    color:var(--text);


    border:1px solid var(--border);


}





button:hover{


    transform:translateY(-3px);


}





.quote{


    margin-top:30px;


    color:var(--text-secondary);


    font-size:13px;


}






@keyframes float{


    50%{


        transform:translateY(-10px);


    }


}




@keyframes show{


    from{


        opacity:0;


        transform:translateY(30px);


    }


    to{


        opacity:1;


        transform:translateY(0);


    }


}



</style>


</head>



<body>



<div class="app">



<div class="lobby">



<div class="logo-box">


<div class="logo">

K

</div>


</div>





<h1 class="title">

Konkor

</h1>





<p class="subtitle">

مسیر هوشمند برنامه‌ریزی،
<br>
آزمون و موفقیت در کنکور

</p>






<div class="card">


<button class="login">

ورود به حساب

</button>



<button class="register">

ساخت حساب جدید

</button>



</div>





<div class="quote">

«هر روز یک قدم به هدف نزدیک‌تر شو 🚀»

</div>




</div>


</div>




















<script>
if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register("service-worker.js")
    .then(()=>{
        console.log("Service Worker Registered");
    })
    .catch(err=>{
        console.log("SW Error:", err);
    });

}
</script>



<script>



const loginBtn =
document.querySelector(".login");


const registerBtn =
document.querySelector(".register");




loginBtn.onclick=()=>{


    location.href="login.html";


};



registerBtn.onclick=()=>{


    location.href="register.html";


};




</script>




</body>


</html>
