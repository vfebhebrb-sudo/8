<!-- OTP FORM -->


<form

id="otpForm"

class="login-form">





<!-- PHONE / RUBIKA -->


<div class="form-field">



<div

id="phoneNumber"

type="text"

<svg class="status-icon"

<button

id="sendCodeBtn"

</span>

</button>

تایید کد

</span>



<i class="fa-solid fa-arrow-left"></i>



</button>



</form>









<!-- ==========================
