<script>

console.log("TEST PAGE LOADED");


let selectedTest = null;


// =====================================
// LOADER
// =====================================


function showTestLoader(){

    const loader =
    document.getElementById("testLoader");


    if(loader){

        loader.classList.add("active");

    }

}



function hideTestLoader(){

    const loader =
    document.getElementById("testLoader");


    if(loader){

        loader.classList.remove("active");

    }

}



// =====================================
// ADVICE
// =====================================
function showTestAdvice(){

    const overlay =
    document.querySelector(
        ".test-lock-overlay"
    );


    if(overlay){

        overlay.classList.remove(
            "hidden"
        );

        overlay.style.display =
        "flex";

    }

}



function hideTestAdvice(){

    const overlay =
    document.querySelector(
        ".test-lock-overlay"
    );


    if(overlay){

        overlay.classList.remove("show");

    }

}





document.addEventListener(
"DOMContentLoaded",
()=>{



// =====================================
// ELEMENTS
// =====================================


const activeTestsList =
document.getElementById(
"activeTestsList"
);



const testSubject =
document.getElementById(
"testSubject"
);



const testCount =
document.getElementById(
"testCount"
);



const testDuration =
document.getElementById(
"testDuration"
);



const testAdvice =
document.getElementById(
"testAdvice"
);




// شروع صفحه






// =====================================
// LOAD ONE TEST
// =====================================

async function loadTestData(id){


try{


showTestLoader();



const response =
await fetch(
    `${API_URL}/tests/${id}`
);


if(!response.ok){

throw new Error(
"آزمون پیدا نشد"
);

}




const result =
await response.json();



console.log(
"API RESULT:",
result
);




// گرفتن خود آزمون

const test =
result.test;



if(!test){

throw new Error(
"داده آزمون وجود ندارد"
);

}



selectedTest = test;

showTestLoader();


setTimeout(()=>{

    hideTestLoader();

    renderAnswerSheet();

},1500);

console.log(
"REAL TEST:",
selectedTest
);


// ==============================
// حذف پیام "چیزی برای نمایش وجود ندارد"
// ==============================

const emptyMessage =
document.querySelector(
    ".no-test-message"
);


if(emptyMessage){

    emptyMessage.style.display =
    "none";

}



// ==============================
// پر کردن اطلاعات بالا
// ==============================


document.getElementById(
"testSubject"
).textContent =
test.subject || "-";



document.getElementById(
"testCount"
).textContent =
test.questionCount ||
(test.questions?.length || 0);



document.getElementById(
"testDuration"
).textContent =
(test.duration || 0)
+
" دقیقه";







// ==============================
// توصیه آزمون
// ==============================


const advice =
document.getElementById(
"testAdvice"
);



if(advice){

advice.textContent =
test.advice ||
"با تمرکز و آرامش آزمون را شروع کنید";

}





// ==============================
// لودر
// ==============================


setTimeout(()=>{


hideTestLoader();


showTestAdvice();


},1500);




}

catch(error){


console.log(
"LOAD TEST ERROR:",
error
);



hideTestLoader();


}



}





// =====================================
// LOAD ACTIVE TESTS
// =====================================


async function loadActiveTests(){



try{



const response =
await fetch(
    `${API_URL}/tests`
);

const tests =
await response.json();



console.log(
"ACTIVE TESTS:",
tests
);





if(!tests.length){


activeTestsList.innerHTML = `


<div class="no-test-box">


<h2>
آزمونی وجود ندارد
</h2>


<p>
آزمون فعالی منتشر نشده است
</p>


</div>


`;


return;


}







activeTestsList.innerHTML = "";





tests.forEach(test=>{



activeTestsList.innerHTML += `



<article class="active-test-card">



<div class="active-test-card-header">


<div class="active-test-logo">

<i data-lucide="file-question"></i>

</div>




<div class="active-test-info">


<h4>

${test.title}

</h4>



<span>

${test.questionCount}
سوال -
${test.duration}
دقیقه

</span>



</div>




<time>

${
test.createdAt

?

new Date(test.createdAt)
.toLocaleDateString("fa-IR")

:

"امروز"

}

</time>



</div>






<button

class="active-test-start"

data-id="${test._id}"

>


شروع آزمون


<i data-lucide="arrow-left"></i>


</button>




</article>



`;



});





if(window.lucide){

lucide.createIcons();

}





// =====================================
// BUTTON EVENTS
// =====================================


document
.querySelectorAll(
".active-test-start"
)
.forEach(btn=>{



btn.onclick = ()=>{


const id =
btn.dataset.id;



console.log(
"CLICK TEST:",
id
);



loadTestData(id);



};



});





}
catch(error){


console.log(
"ACTIVE TEST ERROR:",
error
);



}




}





loadActiveTests();







// =====================================
// ANSWER PANEL TOGGLE
// =====================================


const answerPanel =
document.querySelector(
".ah-test-question-panel"
);



const answerToggle =
document.querySelector(
".ah-panel-toggle"
);



if(
answerPanel &&
answerToggle
){


answerToggle.onclick = ()=>{


answerPanel.classList.toggle(
"collapsed"
);


};


}








// =====================================
// ACTIVE TEST PANEL TOGGLE
// =====================================


const activePanel =
document.querySelector(
".ah-active-tests-panel"
);



const activeToggle =
document.querySelector(
".active-panel-toggle"
);



if(
activePanel &&
activeToggle
){


activeToggle.onclick = ()=>{


activePanel.classList.toggle(
"collapsed"
);


};


}





});

</script>ّّّ

<script>


// ==============================
// RENDER QUESTIONS
// ==============================


function renderQuestions(){


    const container =
    document.getElementById(
        "questionsContent"
    );


    if(!container || !selectedTest){
        return;
    }



    container.innerHTML = "";



    selectedTest.questions.forEach(
    (q,index)=>{


        container.innerHTML += `


        <div class="question-item">


            <h3>
                ${index + 1} -
            </h3>


            <p class="question-text">
                ${q.question}
            </p>



            <div class="options">


${ 
q.options.map( 
(option,i)=>`

<label class="option-item">

    <input 
type="radio"
class="input"
name="question-${index}"
value="${i}"
    >

    <span class="custom-checkbox"></span>

    <span class="option-text">
        ${option}
    </span>

</label>

`).join("")
}

            </div>


        </div>


        `;


    });


}






// ==============================
// START TEST BUTTON
// ==============================


const startBtn =
document.getElementById(
    "startTestBtn"
);



if(startBtn){


    startBtn.onclick = ()=>{


        // اجرای لودر

        showTestLoader();



        setTimeout(()=>{


            // بستن لودر

            hideTestLoader();




            // مخفی کردن توصیه ها


            const overlay =
            document.querySelector(
                ".test-lock-overlay"
            );


            if(overlay){

                overlay.classList.add(
                    "hidden"
                );

            }







            // حذف تاری


            const questionsBox =
            document.getElementById(
                "questionsContainer"
            );


            if(questionsBox){

                questionsBox.classList.remove(
                    "locked"
                );

            }







            // حذف پیام خالی


            const emptyMessage =
            document.querySelector(
                ".no-test-message"
            );


            if(emptyMessage){

                emptyMessage.style.display =
                "none";

            }







            // نمایش سوالات


            renderQuestions();



renderAnswerSheet();

            // شروع تایمر


            startTimer();




        },1500);



    };


}




if(window.lucide){

    lucide.createIcons();

}


</script>

<script>
    // =====================================
// RENDER ANSWER SHEET
// =====================================

function renderAnswerSheet(){


    const sheet =
    document.getElementById(
        "answerSheet"
    );


    if(!sheet || !selectedTest){
        return;
    }



    sheet.innerHTML = "";



    selectedTest.questions.forEach(
    (q,index)=>{


        sheet.innerHTML += `


        <button 
        class="answer-number"
        data-question="${index}">

            ${index + 1}

        </button>


        `;


    });





    document
    .querySelectorAll(
        ".answer-number"
    )
    .forEach(btn=>{


        btn.onclick = ()=>{


            const index =
            btn.dataset.question;



            const question =
            document.querySelectorAll(
                ".question-item"
            )[index];



            if(question){

                question.scrollIntoView({
                    behavior:"smooth",
                    block:"center"
                });

            }


        };


    });



}
</script>
