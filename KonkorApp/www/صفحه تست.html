<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
آزمون
</title>


<link rel="stylesheet" href="./3.css">


<script src="https://unpkg.com/lucide@latest"></script>


</head>


<body>



<div class="app">



<!-- =====================================================
     HEADER
===================================================== -->


<header 
class="mobile-header page-animate"
id="appHeader">



<div class="mobile-header-right">


<div class="mobile-profile-menu">


</div>


</div>





<!-- LOGO -->


<div class="mobile-logo">


<i data-lucide="graduation-cap"></i>


<span>
برنامه کنکور
</span>


</div>






<!-- ACTIONS -->


<div class="mobile-header-left">


<button
class="mobile-icon-btn"
id="themeToggle"
aria-label="theme">


<i data-lucide="moon"></i>


</button>





<button
class="mobile-icon-btn"
id="menuToggle"
aria-label="menu">


<i data-lucide="chevron-down"></i>


</button>



</div>




</header>








<!-- =====================================================
     USER + EXAM INFO CARD
===================================================== -->



<div class="exam-user-card">



<!-- USER HEADER -->


<div class="exam-user-header">


<div class="user-icon-box">


<i data-lucide="user-round"></i>


</div>





<div class="user-details">


<h3 id="studentName">

در حال دریافت...

</h3>




<span id="studentCandidateNumber">

شماره داوطلبی: ---

</span>



</div>



</div>







<!-- =====================================================
     EXAM INFO
===================================================== -->


<div class="exam-info-grid">





<div>


<i data-lucide="book-open"></i>


<span id="testSubject">

-

</span>


</div>







<div>


<i data-lucide="file-question"></i>


<span id="testCount">

-

</span>


</div>







<div>


<i data-lucide="clock"></i>


<span id="testDuration">

-

</span>


</div>







<div>


<i data-lucide="calendar-days"></i>


<span id="testTitle">

-

</span>


</div>






</div>







<!-- WARNING -->


<div class="exam-warning">


<i data-lucide="triangle-alert"></i>



<p>

با تمرکز و دقت پاسخ دهید.
بعد از ثبت پاسخ امکان تغییر وجود ندارد.

</p>



</div>





</div>

<!-- =====================================================
     TIMER CARD
===================================================== -->


<div class="timer-card" style="margin-top:12px;">



<div class="timer-header">


<i data-lucide="clock"></i>


<span>
زمان باقی‌مانده
</span>


</div>




<div 
class="timer-display"
id="timer">


00:00


</div>



</div>









<!-- =====================================================
     QUESTIONS BOX
===================================================== -->
<section 
class="mobile-question-box"
id="questionsContainer">


<div 
class="start-overlay"
id="startOverlay">


<button 
id="startExamBtn"
class="start-exam-btn">


<i data-lucide="play"></i>

شروع آزمون


</button>


</div>



<div 
id="questionSlider">


</div>


</section>




<!-- =====================================================
     STATUS BUTTON
===================================================== -->


<button 
class="test-status-tab"
type="button">


<i data-lucide="list-checks"></i>


</button>









<!-- =====================================================
     STATUS PANEL
===================================================== -->


<div class="test-status-panel">





<!-- HEADER -->


<div class="status-panel-header">



<div class="status-title">


<i data-lucide="list-checks"></i>


<span>

وضعیت تست‌ها

</span>


</div>






<button 
class="status-close-btn"
type="button">


<i data-lucide="x"></i>


</button>





</div>









<!-- TEST NUMBER GRID -->


<div 
class="test-status-grid"
id="testStatusGrid">



<!-- شماره سوالات اینجا توسط JS ساخته می‌شود -->


</div>






</div>









</div>
<!-- END APP -->

<script src="../config.js"></script>

<script src="./8.js"></script>

<script>

lucide.createIcons();

</script>


</body>

</html>
