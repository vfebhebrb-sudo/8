<!-- ==========================
        TYPING EFFECT
========================== -->


<script>

const texts = [

    "تایید شماره تلفن",

    "کد ارسال شده را وارد کنید",

    "حساب شما در حال آماده سازی است",

    "به کدماتیک خوش آمدید"

];


const typing = document.getElementById("typing-text");


let textIndex = 0;
let charIndex = 0;
let deleting = false;


function typeEffect(){

    if(!typing) return;


    const current = texts[textIndex];


    if(!deleting){

        typing.textContent =
            current.substring(0,charIndex++);


        if(charIndex > current.length){

            deleting = true;

            setTimeout(typeEffect,1500);

            return;

        }

    }

    else{

        typing.textContent =
            current.substring(0,charIndex--);


        if(charIndex < 0){

            deleting = false;

            textIndex++;

            if(textIndex >= texts.length){

                textIndex = 0;

            }

        }

    }


    setTimeout(
        typeEffect,
        deleting ? 40 : 80
    );

}


typeEffect();

</script>
