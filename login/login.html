<div class="login-page">

    <!--==========================

    ===========================-->

    <div class="background-glow"></div>

    <div class="background-grid"></div>

            LOGIN CARD
    ===========================-->

    <section class="login-card">


        <div class="login-right">

            <div class="panel-header" style=" margin-bottom: -8px;">

                </div>

        <!-- FORM -->

                    <form 
            id="loginForm"
            class="login-form">



            <!-- EMAIL -->

       <div 
class="input-box"
id="loginIdentityGroup">


    <div class="input-icon">

        <i class="fa-solid fa-user"></i>

    </div>


    <input
    id="loginIdentity"
    name="identity"
    type="text"
    autocomplete="username"
    placeholder="شماره تلفن یا ایمیل خود را وارد کنید">


    <div class="field-status">

        <svg 
        class="status-icon"
        viewBox="0 0 52 52">


            <circle
            class="status-circle"
            cx="26"
            cy="26"
            r="22"/>


            <path
            class="status-check"
            d="M16 27 L23 34 L37 18"/>


            <path
            class="status-cross1"
            d="M18 18 L34 34"/>


            <path
            class="status-cross2"
            d="M34 18 L18 34"/>


        </svg>

    </div>


</div>






            <!-- PASSWORD -->

            <div class="input-box">


                <div class="input-icon">

                    <i class="fa-solid fa-lock"></i>

                </div>



                <input
                id="loginPassword"
                type="password"
                placeholder="رمز عبور">

                <div class="password-eye" id="passwordEye">

                    <i class="fa-solid fa-eye"></i>

                </div>



            </div>









            <!-- OPTIONS -->


            <div class="form-options">


                <label class="remember">


                    <!-- <input type="checkbox"> -->

                    <label class="container">
                    <input type="checkbox">
                    <svg viewBox="0 0 64 64" height="1em" width="1em">
                        <path d="M 0 16 V 56 A 8 8 90 0 0 8 64 H 56 A 8 8 90 0 0 64 56 V 8 A 8 8 90 0 0 56 0 H 8 A 8 8 90 0 0 0 8 V 16 L 32 48 L 64 16 V 8 A 8 8 90 0 0 56 0 H 8 A 8 8 90 0 0 0 8 V 56 A 8 8 90 0 0 8 64 H 56 A 8 8 90 0 0 64 56 V 16" pathLength="575.0541381835938" class="path"></path>
                    </svg>
                    </label>
                    <span>
                        مرا به خاطر بسپار
                    </span>


                </label>





                <a href="./تغییر رمز.html">

                    فراموشی رمز؟

                </a>



            </div>



           <!-- -- خطا -- -->
            <div 
            class="login-error"
            id="loginError">
            </div>




           <!--==========================
        LOGIN BUTTON
===========================-->

            <button
                id="loginBtn"
                class="login-btn"
                type="submit">

                <span id="loginBtnText">
                    ورود به حساب
                </span>

                <i 
                    id="loginBtnIcon"
                    class="fa-solid fa-arrow-left">
                </i>

            </button>

            <div 
             class="login-error"
            id="loginError">

            </div>

            <div 
            class="login-success"
            id="loginSuccess">

            </div>




            <!-- DIVIDER -->


            <div class="divider">


                <span></span>


                <p>
                    یا
                </p>


                <span></span>



            </div>









            <!-- SOCIAL LOGIN -->


            <div class="social-login">



                <button
                type="button"
                class="google-btn">


                    <i class="fa-brands fa-google"></i>


                    <span>
                        ورود با گوگل
                    </span>



                </button>








                <button
                type="button"
                class="github-btn">


                    <i class="fa-brands fa-github"></i>



                    <span">
                        ورود با گیت‌هاب
                    </span>



                </button>




            </div>






        </form>







        <!-- FOOTER -->


        <div class="panel-footer">


            <p>

                حساب ندارید؟

            <a href="register.html" id="registerLink">

                ثبت نام

            </a>

            </p>


        </div>





    </div>


</div>
